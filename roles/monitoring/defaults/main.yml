---
# Prometheus & Node Exporter Versions
prometheus_version: "2.51.0"
prometheus_archive: "prometheus-{{ prometheus_version }}.linux-amd64"
prometheus_download_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/{{ prometheus_archive }}.tar.gz"

node_exporter_version: "1.7.0"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}.tar.gz"

# Ports (defaults from group_vars if not defined)
prometheus_port: 9090
node_exporter_port: 9100
grafana_port: 3000

# Grafana admin credentials
grafana_admin_user: "admin"
grafana_admin_password: "admin_password123"
